name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.134.3"
          extended: true

      - name: Build website
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages 
          force_orphan: true 
  build-pdf:
    runs-on: ubuntu-latest
    # needs: build-deploy
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install TeX Live and pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-other \
            latexmk \
            pandoc

      - name: Verify LaTeX packages
        run: |
          echo "=== Checking key packages ==="
          for pkg in vntex mathptmx fancyhdr mdframed pdfpages float listings; do
            if kpsewhich ${pkg}.sty > /dev/null 2>&1; then
              echo "  $pkg: found"
            else
              echo "  $pkg: NOT FOUND"
            fi
          done

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Flatten Workshop directory for LaTeX
        run: |
          # Tìm và di chuyển tất cả các thư mục con ra ngang hàng dưới 5-Workshop
          # Dùng lệnh find để chỉ di chuyển thư mục, không ghi đè các file _index.md
          find content/5-Workshop/5.3-S3 -mindepth 1 -maxdepth 1 -type d -exec mv {} content/5-Workshop/ \;
          find content/5-Workshop/5.4-Lambda-Data -mindepth 1 -maxdepth 1 -type d -exec mv {} content/5-Workshop/ \;
          find content/5-Workshop/5.5-testing -mindepth 1 -maxdepth 1 -type d -exec mv {} content/5-Workshop/ \;
          
          # Xóa bỏ các thư mục nhóm cha để script không gom nội dung thừa
          rm -rf content/5-Workshop/5.3-S3
          rm -rf content/5-Workshop/5.4-Lambda-Data
          rm -rf content/5-Workshop/5.5-testing

      - name: Convert Hugo content to LaTeX
        run: python3 scripts/convert_hugo_to_latex.py

      - name: Compile Vietnamese PDF
        working-directory: report
        run: |
          latexmk -pdf -interaction=nonstopmode main.tex
          latexmk -pdf -interaction=nonstopmode main.tex
          latexmk -pdf -interaction=nonstopmode main.tex
          cp main.pdf ../report_vn.pdf

      # - name: Compile English PDF
      #   working-directory: report
      #   run: |
      #     latexmk -pdf -interaction=nonstopmode main_en.tex
      #     latexmk -pdf -interaction=nonstopmode main_en.tex
      #     latexmk -pdf -interaction=nonstopmode main_en.tex
      #     cp main_en.pdf ../report_en.pdf
      
      - name: Package LaTeX source
        run: |
          zip -r latex_source.zip report scripts content config.toml \
            -x "report/*.aux" \
            -x "report/*.log" \
            -x "report/*.out" \
            -x "report/*.toc" \
            -x "report/*.fls" \
            -x "report/*.fdb_latexmk" \
            -x "report/*.pdf"
      
      # Thêm bước này để hiển thị file ở mục Artifacts trong trang Actions
      - name: Upload PDF to Actions
        uses: actions/upload-artifact@v4
        with:
          name: Báo-cáo-thực-tập-VN
          path: report_vn.pdf

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Latest Internship Reports"
          body: |
            ## Internship Report PDFs

            Automated PDF generation from Hugo content on push to `main`.

            - **Vietnamese**: `report_vn.pdf`
            - **LaTeX source**: `latex_source.zip`
          artifacts: "report_vn.pdf,latex_source.zip"
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

